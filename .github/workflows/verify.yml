name: Verify and build

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate dependencies
        run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Linux tests with a virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
          xvfb-run -a python -m unittest discover -s tests -v
          xvfb-run -a python main.py --smoke-test build/source-check.json
          xvfb-run -a python main.py --performance-check build/source-performance.json
      - name: Windows tests
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Build and verify Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build_windows.ps1
      - name: Upload verified Windows application
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: DynamicsControlLab-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/DynamicsControlLab.zip
            build/release-check.json
            build/performance-check.json
            build/startup.json
            output/pdf/docs.pdf
            requirements.txt
            requirements-dev.txt
